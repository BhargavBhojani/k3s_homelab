apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx
  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/BhargavBhojani/k3s_homelab.git

    targetRevision: main

    path: applications/nginx

  destination:

    server: https://kubernetes.default.svc

    namespace: default

  syncPolicy:

    automated:

      prune: true

      selfHeal: true
