apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:

    metadata:

      labels:
        app: nginx

    spec:

      nodeSelector:
        node-role.kubernetes.io/worker: worker

      containers:

      - name: nginx

        image: nginx:latest

        ports:

        - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: nginx

spec:

  selector:
    app: nginx

  ports:

  - port: 80
