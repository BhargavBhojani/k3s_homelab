apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.102.3

    helm:
      values: |
        oauth:
          clientId: "kEoMNGHqQH11CNTRL"
          clientSecret: "tskey-client-kEoMNGHqQH11CNTRL-3x3mVWpJb5TvMU6hXhjq5TcU5U3RQrJ8K"

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
