grafana:
  enabled: true

  nodeSelector:
    node-role.kubernetes.io/worker: worker

  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.home.lab
    path: /
    pathType: Prefix

prometheus:
  enabled: true

  prometheusSpec:
    nodeSelector:
      node-role.kubernetes.io/worker: worker

    replicas: 1

    retention: 7d

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    nodeSelector:
      node-role.kubernetes.io/worker: worker

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
